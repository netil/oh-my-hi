<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oh-my-hi</title>
  <link rel="stylesheet" href="/static/billboard.min.css">
  <link id="bb-dark-theme" rel="stylesheet" href="/static/billboard-dark.min.css" disabled>
  <link rel="stylesheet" href="/static/styles-__VERSION__.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo" id="sidebar-logo" style="cursor:pointer">
        <div class="sidebar-logo-main">
          <span class="sidebar-logo-icon">👋</span>
          <span class="sidebar-logo-text">oh-my-hi</span>
          <!-- theme-btn, help-btn appended here by JS, then sidebar-toggle-inline -->
          <button class="sidebar-toggle sidebar-toggle-inline" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar" onclick="event.stopPropagation()">
            <span></span><span></span><span></span>
          </button>
        </div>
        <div class="sidebar-logo-tagline" id="sidebar-logo-tagline">Oh, so that's what Claude's been doing!</div>
        <div class="sidebar-logo-sub">
          <span class="sidebar-logo-version">v__VERSION__</span>
          <div class="lang-toggle-group" id="lang-toggle-group">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ko">KO</button>
          </div>
        </div>
      </div>
      <div class="sidebar-toggle-wrap">
        <button class="sidebar-toggle sidebar-toggle-collapsed" title="Toggle sidebar" aria-label="Toggle sidebar">
          <span></span><span></span><span></span>
        </button>
      </div>
      <div class="sidebar-period" id="sidebar-period"></div>
      <div class="sidebar-header">
        <div class="sidebar-header-top">
          <label class="scope-label" for="scope-select">Scope</label>
        </div>
        <select id="scope-select" class="scope-select" title=""></select>
      </div>
      <div class="sidebar-search">
        <input type="text" id="search" placeholder="Search..." />
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <main class="content" id="content"></main>
  </div>
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
  </div>
  <script src="/static/billboard.pkgd.min.js"></script>
  <script>
    let __EN__ = __EN_DATA__;
    let __LOCALE__ = __LOCALE_DATA__;
  </script>
  <script src="/static/app-__VERSION__.js"></script>
</body>
</html>
